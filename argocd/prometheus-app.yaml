apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Deliberately the small standalone "prometheus" chart, not
    # kube-prometheus-stack - no CRDs (avoids the annotation-too-long CRD
    # apply issue an earlier, unrelated Application on this cluster hit),
    # no bundled Alertmanager. Grafana lives in its own Application
    # (grafana-app.yaml) and points at this Prometheus as a datasource.
    #
    # Vendored from prometheus-community/helm-charts (chart version 29.27.0)
    # into charts/prometheus so this repo is the single source of truth for
    # everything the cluster runs, same as every other app here.
    repoURL: https://github.com/harrylog/argocd-octopus-1.git
    path: charts/prometheus
    targetRevision: main
    helm:
      releaseName: prometheus
      parameters:
        - name: alertmanager.enabled
          value: "false"
        - name: prometheus-pushgateway.enabled
          value: "false"
        # node-exporter (host CPU/mem/disk metrics) is cheap on a single
        # laptop node and is what the classic "Node Exporter Full" Grafana
        # dashboard needs - worth having now that this is a general
        # monitoring platform, not just a Rollouts-analysis backend.
        - name: prometheus-node-exporter.enabled
          value: "true"
        # kube-state-metrics stays enabled (default) - object-level metrics
        # (kube_replicaset_status_ready_replicas etc.) used by
        # canary-analysis-demo's AnalysisTemplate.
        # 5s scrape/timeout: fast enough that canary-analysis-demo's 15s
        # analysis interval isn't reading stale pre-rollout samples.
        # scrape_timeout must never exceed scrape_interval - Prometheus
        # rejects the reload outright (and silently keeps running on the
        # old config) if it does; confirmed live while building this.
        - name: server.global.scrape_interval
          value: "5s"
        - name: server.global.scrape_timeout
          value: "5s"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Manual sync only - no automated/selfHeal. Run `argocd app sync prometheus`
  # (or sync from the UI) to apply changes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
