apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Helm chart pulled straight from its upstream git repo (path = chart dir),
    # not from ours - a different Application.source shape than pingpong's.
    # (Both the tutorial's bitnami-labs.github.io Helm-repo URL and the
    # charts.bitnami.com index are dead/unreachable post-Broadcom; the chart
    # still lives in-repo at bitnami/sealed-secrets, so we source it from git.)
    repoURL: https://github.com/bitnami/sealed-secrets.git
    path: helm/sealed-secrets
    targetRevision: main
    helm:
      parameters:
        - name: fullnameOverride
          value: sealed-secrets-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets

  # Manual sync only - no automated/selfHeal. Run `argocd app sync sealed-secrets`
  # (or sync from the UI) to apply changes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
