apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pingpong
  namespace: argocd
  finalizers:
    # Ensures ArgoCD cleans up deployed resources if this Application is deleted.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/harrylog/argocd-octopus-1.git
    targetRevision: main
    path: charts/pingpong
    helm:
      valueFiles:
        - values.yaml
      # Equivalent of `helm install --set message=...`. Overrides values.yaml
      # without editing the chart - handy for per-Application tweaks.
      parameters:
        - name: message
          value: "pong (via ArgoCD override)"

  destination:
    server: https://kubernetes.default.svc
    namespace: pingpong

  # Manual sync only - no automated/selfHeal. Run `argocd app sync pingpong`
  # (or sync from the UI) to apply changes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
