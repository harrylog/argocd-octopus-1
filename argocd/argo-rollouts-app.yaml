apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Argo's own Helm charts live in a separate repo from argo-rollouts
    # itself - same "source straight from upstream git" shape as sealed-secrets.
    repoURL: https://github.com/argoproj/argo-helm.git
    path: charts/argo-rollouts
    targetRevision: main
    helm:
      parameters:
        # Deploys the built-in web dashboard (ClusterIP :3100) alongside the
        # controller, so you can watch a rollout progress without installing
        # the kubectl plugin. See README for how to reach it.
        - name: dashboard.enabled
          value: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  # Manual sync only - no automated/selfHeal. Run `argocd app sync argo-rollouts`
  # (or sync from the UI) to apply changes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
