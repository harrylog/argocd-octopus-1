apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # NOTE: named "rollouts-prometheus", not "prometheus" - this cluster
  # already has an unrelated "prometheus" Application (from a different
  # repo, observability-monitoring-1/kube-prometheus-stack). Don't rename
  # this back to "prometheus" or the two will collide on the same
  # Application object again. helm.releaseName below is still "prometheus"
  # on purpose - only the ArgoCD-level name changed, resource names
  # (prometheus-server, etc.) referenced by canary-analysis-demo did not.
  name: rollouts-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Deliberately the small standalone "prometheus" chart, not
    # kube-prometheus-stack - no CRDs (avoids the annotation-too-long CRD
    # apply issue), no Grafana/Alertmanager, just a server + kube-state-metrics
    # so canary-analysis-demo has something real to query. Self-contained POC,
    # unrelated to any other observability stack.
    repoURL: https://github.com/prometheus-community/helm-charts.git
    path: charts/prometheus
    targetRevision: main
    helm:
      releaseName: prometheus
      parameters:
        - name: alertmanager.enabled
          value: "false"
        - name: prometheus-node-exporter.enabled
          value: "false"
        - name: prometheus-pushgateway.enabled
          value: "false"
        # kube-state-metrics stays enabled (default) - it's what exposes
        # kube_replicaset_status_ready_replicas for the AnalysisTemplate.
        # 5s so canary-analysis-demo's AnalysisTemplate measurements (every
        # 15s) aren't reading a stale pre-rollout scrape on the first one.
        - name: server.global.scrape_interval
          value: "5s"

  destination:
    server: https://kubernetes.default.svc
    namespace: rollouts-metrics

  # Manual sync only - no automated/selfHeal. Run `argocd app sync rollouts-prometheus`
  # (or sync from the UI) to apply changes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
