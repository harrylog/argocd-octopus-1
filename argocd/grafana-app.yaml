apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Vendored from grafana/helm-charts (chart version 10.5.15) into
    # charts/grafana so this repo is the single source of truth for
    # everything the cluster runs, same as every other app here.
    repoURL: https://github.com/harrylog/argocd-octopus-1.git
    path: charts/grafana
    targetRevision: main
    helm:
      releaseName: grafana
      parameters:
        - name: fullnameOverride
          value: grafana
        # No adminPassword set here on purpose - the chart auto-generates
        # one into a Secret (name: "grafana", keys admin-user/admin-password)
        # rather than putting a plaintext password in git.
      values: |
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server.monitoring.svc.cluster.local
                access: proxy
                isDefault: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Manual sync only - no automated/selfHeal. Run `argocd app sync grafana`
  # (or sync from the UI) to apply changes.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
