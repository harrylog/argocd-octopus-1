apiVersion: v1
kind: Service
metadata:
  name: {{ include "canary-analysis-demo.fullname" . }}-stable
  labels:
    {{- include "canary-analysis-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "canary-analysis-demo.selectorLabels" . | nindent 4 }}
