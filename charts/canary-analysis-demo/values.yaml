# Default values for the canary-analysis-demo chart.

replicaCount: 4

# argoproj/rollouts-demo - same image bluegreen-demo/canary-demo use.
# Tags "bad-<color>" ship with ERROR_RATE baked in, making /color
# intermittently return HTTP 500 (vs. plain "<color>", which never does).
# The container itself never crashes - only the rollout.yaml readinessProbe
# hitting /color is what turns that into a Ready/NotReady signal at all.
image:
  repository: argoproj/rollouts-demo
  tag: "blue"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Canary steps: land 25% of traffic on the canary, then let a Prometheus
# AnalysisTemplate decide - no human promote - whether to continue to 100%
# or auto-abort. See templates/rollout.yaml + templates/analysistemplate.yaml.
canary:
  weight: 25

# AnalysisTemplate settings. The query asks kube-state-metrics (via the
# Prometheus POC, entry "prometheus" in charts/root-app/values.yaml) what
# fraction of the canary ReplicaSet's pods are Ready - no app-level
# instrumentation required.
analysis:
  prometheusAddress: http://prometheus-server.monitoring.svc.cluster.local
  # 15s: long enough that by measurement 2 a healthy pod has cleared its
  # readinessProbe's initialDelaySeconds and Prometheus has a fresh (5s
  # scrape_interval) sample - not just startup lag showing up as "0 ready".
  interval: "15s"
  count: 3
  # tolerate 1 bad measurement (pod still starting on the very first
  # measurement is normal); a second failure means genuinely unhealthy.
  failureLimit: 1
