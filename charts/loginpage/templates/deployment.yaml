apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loginpage.fullname" . }}
  labels:
    {{- include "loginpage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "loginpage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loginpage.selectorLabels" . | nindent 8 }}
      annotations:
        # Forces a rollout when the ConfigMap's content changes, since nginx
        # won't reload it on its own once mounted.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: htpasswd
              mountPath: /etc/nginx/secrets
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "loginpage.fullname" . }}
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: html
          configMap:
            name: {{ include "loginpage.fullname" . }}
            items:
              - key: index.html
                path: index.html
        - name: htpasswd
          secret:
            secretName: {{ .Values.secretName }}
