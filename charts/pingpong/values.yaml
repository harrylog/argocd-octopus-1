# Default values for the pingpong chart.

replicaCount: 1

image:
  repository: hashicorp/http-echo
  tag: "1.0"
  pullPolicy: IfNotPresent

# Text returned by the app on every request.
message: "pong"

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
