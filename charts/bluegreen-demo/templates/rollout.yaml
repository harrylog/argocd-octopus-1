apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "bluegreen-demo.fullname" . }}
  labels:
    {{- include "bluegreen-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "bluegreen-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bluegreen-demo.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: bluegreen-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  strategy:
    blueGreen:
      # active = what "real" users hit. preview = where the new version
      # lands first so you can eyeball it before flipping active over.
      activeService: {{ include "bluegreen-demo.fullname" . }}-active
      previewService: {{ include "bluegreen-demo.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
