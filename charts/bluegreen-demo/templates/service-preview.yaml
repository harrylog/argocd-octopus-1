apiVersion: v1
kind: Service
metadata:
  name: {{ include "bluegreen-demo.fullname" . }}-preview
  labels:
    {{- include "bluegreen-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # Selector is managed by the Rollout controller - it rewrites this to
  # point at the new ("preview") ReplicaSet during a rollout.
  selector:
    {{- include "bluegreen-demo.selectorLabels" . | nindent 4 }}
