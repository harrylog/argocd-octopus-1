apiVersion: v1
kind: Service
metadata:
  name: {{ include "canary-demo.fullname" . }}-canary
  labels:
    {{- include "canary-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # Selector is managed by the Rollout controller - points only at the
  # newest ReplicaSet while a rollout is in progress (empty/unused at rest).
  selector:
    {{- include "canary-demo.selectorLabels" . | nindent 4 }}
